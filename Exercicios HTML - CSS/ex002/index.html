<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever um paragrafo
        de Qualquer
        jeito
        Desde que esteja entre os valores de p e /p &lt;p&gt; &lt;/p&gt; <!--lt = less than e gt = greater than -->
    </p>
    <p>Se precisar quebrar o texto em algum lugar específico <br> como esse <br>
        você pode usar a tag br. <!--utilização de comentarios! Essa parte não aparece no site, serve para descrever lógica-->
    </p>

    <p>Adicionando simbolos especiais: <br>
        &reg; &trade; &copy;
    </p>

    <p>ADICIONANDO EMOJIS!: <br>
     &#x1F913 <!-- &#x antecede o código do emoji em particular  -->
     😁 <!-- é Possivel adicionar os emojis diretamente copiando e colando porem dessa forma pode não funcionar em certos navegadores  -->

    </p>

</body>
</html>
